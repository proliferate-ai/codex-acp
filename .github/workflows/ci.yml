name: CI

on:
  push:
    branches: [main]
  pull_request:
    # canonical-1.1.14-base is the AnyHarness fork line; PRs onto it need the
    # same typecheck/test/bundle gate as main.
    branches: [main, canonical-1.1.14-base]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Bundle binaries
        run: npm run bundle:all
